<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <meta name="description" content="Preparazione atletica per terzino sinistro: garage e strada, la settimana costruita intorno alla partita.">
  <title>Terzino — Preparazione Atletica</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header id="testata">
    <h1>⚽ TERZINO</h1>
    <span id="fase-badge" class="chip"></span>
  </header>

  <main id="contenuto"></main>

  <!-- overlay della seduta -->
  <div id="overlay"><div id="overlay-contenuto"></div></div>

  <!-- pillola di recupero (sempre visibile mentre corre) -->
  <div id="pillola">
    <div id="pillola-progresso"><div id="pillola-barra"></div></div>
    <span id="pillola-label">Recupero</span>
    <strong id="pillola-tempo">0:00</strong>
    <button data-action="pillola-salta">salta ›</button>
  </div>

  <!-- avvisi -->
  <div id="toast"></div>

  <nav id="navbar">
    <button class="nav-btn attivo" data-action="tab" data-tab="settimana"><span>📅</span>Settimana</button>
    <button class="nav-btn" data-action="tab" data-tab="prep"><span>🔥</span>Prep</button>
    <button class="nav-btn" data-action="tab" data-tab="sixpack"><span>🛡️</span>Six Pack</button>
    <button class="nav-btn" data-action="tab" data-tab="timer"><span>⏱</span>Timer</button>
    <button class="nav-btn" data-action="tab" data-tab="progressi"><span>📈</span>Progressi</button>
    <button class="nav-btn" data-action="tab" data-tab="storico"><span>📖</span>Storico</button>
    <button class="nav-btn" data-action="tab" data-tab="dati"><span>💾</span>Dati</button>
  </nav>

  <script src="js/util.js"></script>
  <script src="js/data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
